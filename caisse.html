<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23D4532A%22/></svg>">
<title>Ma Caisse — Le Montmorency</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange: #D4532A;
    --orange-light: #E8784F;
    --orange-pale: #F2A882;
    --dark: #0A0806;
    --dark2: #140E09;
    --dark3: #1E1610;
    --cream: #F5EDE0;
    --text-muted: #9A7F68;
    --green: #6FA96F;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 1.2rem; background: var(--dark2);
    border-bottom: 0.5px solid rgba(212,83,42,0.3);
    position: sticky; top: 0; z-index: 50;
  }
  .head-logo { display: flex; align-items: center; gap: 0.7rem; }
  .head-logo img { height: 44px; width: 44px; object-fit: contain; }
  .head-title { font-family: 'Cormorant Garamond', serif; font-size: 1rem; letter-spacing: 0.2em; color: var(--orange-light); text-transform: uppercase; }
  .head-sub { font-size: 0.55rem; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }
  .head-right { display: flex; align-items: center; gap: 1rem; }
  .day-total-badge { text-align: right; }
  .day-total-badge .amount { font-size: 1.05rem; font-weight: 700; color: var(--orange-pale); }
  .day-total-badge .label { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .back-link { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; border: 0.5px solid rgba(212,83,42,0.4); padding: 0.45rem 0.8rem; }
  .back-link:hover { color: var(--cream); border-color: var(--orange); }

  /* LAYOUT */
  .caisse-layout { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 62px); }

  /* PRODUITS */
  .produits { padding: 1.2rem; }
  .cat-tabs { display: flex; border: 0.5px solid rgba(212,83,42,0.3); width: fit-content; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .cat-tab { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); padding: 0.7rem 1.4rem; background: transparent; border: none; cursor: pointer; transition: all 0.2s; border-right: 0.5px solid rgba(212,83,42,0.2); font-family: 'DM Sans', sans-serif; }
  .cat-tab:last-child { border-right: none; }
  .cat-tab.active { background: var(--orange); color: var(--cream); }

  .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.7rem; }
  .prod-btn {
    background: var(--dark3); border: 0.5px solid rgba(212,83,42,0.25);
    color: var(--cream); cursor: pointer; padding: 1rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.35rem; text-align: left;
    font-family: 'DM Sans', sans-serif; transition: all 0.15s; min-height: 82px;
  }
  .prod-btn:hover { border-color: var(--orange); background: rgba(212,83,42,0.12); }
  .prod-btn:active { transform: scale(0.97); background: rgba(212,83,42,0.25); }
  .prod-name { font-size: 0.85rem; font-weight: 500; line-height: 1.3; }
  .prod-price { font-size: 0.75rem; color: var(--orange-light); }

  /* TICKET */
  .ticket {
    background: var(--dark2); border-left: 0.5px solid rgba(212,83,42,0.25);
    display: flex; flex-direction: column; padding: 1.2rem;
    position: sticky; top: 62px; height: calc(100vh - 62px); overflow-y: auto;
  }
  .ticket h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 400; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .ticket h2 em { font-style: italic; color: var(--orange-light); }
  .btn-clear { font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; background: transparent; border: 0.5px solid rgba(212,83,42,0.4); color: var(--text-muted); cursor: pointer; padding: 0.35rem 0.7rem; font-family: 'DM Sans', sans-serif; }
  .btn-clear:hover { color: var(--cream); border-color: var(--orange); }

  .ticket-lines { flex: 1; overflow-y: auto; min-height: 120px; }
  .ticket-empty { font-size: 0.78rem; color: var(--text-muted); font-style: italic; padding: 1.5rem 0; text-align: center; }
  .ticket-line { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-bottom: 0.5px solid rgba(212,83,42,0.1); }
  .tl-name { flex: 1; font-size: 0.82rem; line-height: 1.3; }
  .tl-qty { display: flex; align-items: center; gap: 0.4rem; }
  .qty-btn { width: 26px; height: 26px; background: var(--dark3); border: 0.5px solid rgba(212,83,42,0.35); color: var(--cream); cursor: pointer; font-size: 0.9rem; line-height: 1; font-family: 'DM Sans', sans-serif; }
  .qty-btn:hover { border-color: var(--orange); }
  .tl-qty span { font-size: 0.85rem; min-width: 18px; text-align: center; }
  .tl-total { font-size: 0.8rem; color: var(--orange-light); min-width: 74px; text-align: right; white-space: nowrap; }

  .ticket-total { display: flex; justify-content: space-between; align-items: baseline; padding: 1rem 0 0.6rem; border-top: 0.5px solid rgba(212,83,42,0.35); margin-top: 0.6rem; }
  .ticket-total .label { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-muted); }
  .ticket-total .value { font-size: 1.6rem; font-weight: 700; color: var(--orange-pale); }

  .pay-row { display: flex; align-items: center; gap: 0.7rem; margin: 0.5rem 0; }
  .pay-row label { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); flex: 1; }
  .pay-row input { width: 130px; background: var(--dark3); border: 0.5px solid rgba(212,83,42,0.35); color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 1rem; padding: 0.5rem 0.7rem; text-align: right; outline: none; }
  .pay-row input:focus { border-color: var(--orange); }
  .monnaie { display: flex; justify-content: space-between; align-items: baseline; margin: 0.3rem 0 0.8rem; }
  .monnaie .label { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .monnaie .value { font-size: 1.15rem; font-weight: 700; color: var(--green); }
  .monnaie .value.negative { color: var(--orange-light); }

  .btn-encaisser {
    width: 100%; padding: 1rem; background: var(--orange); border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream); transition: background 0.2s;
  }
  .btn-encaisser:hover { background: var(--orange-light); }
  .btn-encaisser:disabled { opacity: 0.35; cursor: not-allowed; }

  /* JOURNAL */
  .journal { padding: 1.5rem 1.2rem 3rem; border-top: 0.5px solid rgba(212,83,42,0.2); grid-column: 1 / -1; background: var(--dark2); }
  .journal-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; max-width: 900px; margin-left: auto; margin-right: auto; }
  .journal-head h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 400; }
  .journal-head h2 em { font-style: italic; color: var(--orange-light); }
  .journal-stats { display: flex; gap: 2rem; }
  .jstat .num { font-size: 1.2rem; font-weight: 700; color: var(--orange-pale); }
  .jstat .lbl { font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .journal-table { max-width: 900px; margin: 0 auto; border: 0.5px solid rgba(212,83,42,0.15); }
  .jrow { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; border-bottom: 0.5px solid rgba(212,83,42,0.08); font-size: 0.8rem; }
  .jrow:last-child { border-bottom: none; }
  .jrow .time { color: var(--text-muted); min-width: 52px; }
  .jrow .items { flex: 1; color: var(--cream); line-height: 1.5; }
  .jrow .amount { color: var(--orange-light); font-weight: 500; white-space: nowrap; }
  .jrow .del { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 0.2rem 0.4rem; font-family: 'DM Sans', sans-serif; }
  .jrow .del:hover { color: var(--orange-light); }
  .journal-empty { padding: 1.5rem; text-align: center; font-size: 0.78rem; color: var(--text-muted); font-style: italic; }
  .journal-actions { max-width: 900px; margin: 1rem auto 0; display: flex; gap: 0.8rem; flex-wrap: wrap; }
  .btn-small { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; background: transparent; border: 0.5px solid rgba(212,83,42,0.4); color: var(--text-muted); cursor: pointer; padding: 0.55rem 1rem; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .btn-small:hover { color: var(--cream); border-color: var(--orange); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--green); color: var(--dark); font-weight: 700; font-size: 0.8rem;
    letter-spacing: 0.1em; padding: 0.8rem 1.6rem; opacity: 0; transition: all 0.3s; z-index: 100;
    pointer-events: none; text-transform: uppercase;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* RESPONSIVE */
  @media (max-width: 860px) {
    .caisse-layout { grid-template-columns: 1fr; }
    .ticket { position: static; height: auto; border-left: none; border-top: 0.5px solid rgba(212,83,42,0.25); }
    .prod-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .head-title { font-size: 0.85rem; }
    .day-total-badge .amount { font-size: 0.9rem; }
    .cat-tabs { width: 100%; }
    .cat-tab { flex: 1; padding: 0.7rem 0.4rem; font-size: 0.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="head-logo">
    <img src="logo.jpg" alt="Le Montmorency">
    <div>
      <div class="head-title">Ma Caisse</div>
      <div class="head-sub">Le Montmorency</div>
    </div>
  </div>
  <div class="head-right">
    <div class="day-total-badge">
      <div class="amount" id="headDayTotal">0 FCFA</div>
      <div class="label">Recette du jour</div>
    </div>
    <a class="back-link" href="index.html">Site</a>
  </div>
</header>

<div class="caisse-layout">

  <!-- PRODUITS -->
  <section class="produits">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="prod-grid" id="prodGrid"></div>
  </section>

  <!-- TICKET -->
  <aside class="ticket">
    <h2><span>Ticket <em>en cours</em></span><button class="btn-clear" onclick="clearTicket()">Vider</button></h2>
    <div class="ticket-lines" id="ticketLines"></div>
    <div class="ticket-total">
      <span class="label">Total</span>
      <span class="value" id="ticketTotal">0 FCFA</span>
    </div>
    <div class="pay-row">
      <label for="recu">Montant reçu</label>
      <input type="number" id="recu" inputmode="numeric" min="0" step="100" placeholder="0" oninput="renderMonnaie()">
    </div>
    <div class="monnaie">
      <span class="label">Monnaie à rendre</span>
      <span class="value" id="monnaie">—</span>
    </div>
    <button class="btn-encaisser" id="btnEncaisser" onclick="encaisser()" disabled>Encaisser</button>
  </aside>

  <!-- JOURNAL DU JOUR -->
  <section class="journal">
    <div class="journal-head">
      <h2>Journal <em>du jour</em> — <span id="journalDate"></span></h2>
      <div class="journal-stats">
        <div class="jstat"><div class="num" id="statCount">0</div><div class="lbl">Ventes</div></div>
        <div class="jstat"><div class="num" id="statTotal">0 FCFA</div><div class="lbl">Recette</div></div>
      </div>
    </div>
    <div class="journal-table" id="journalTable"></div>
    <div class="journal-actions">
      <button class="btn-small" onclick="exportCSV()">Exporter (CSV)</button>
      <button class="btn-small" onclick="clearDay()">Effacer la journée</button>
    </div>
  </section>

</div>

<div class="toast" id="toast">Vente enregistrée ✓</div>

<script>
// ---------- Carte & prix ----------
const CATEGORIES = [
  { id: 'braises', label: 'Braisés', items: [
    { name: 'Poisson braisé (petit)', price: 4000 },
    { name: 'Poisson braisé (moyen)', price: 5000 },
    { name: 'Poisson braisé (grand)', price: 7000 },
    { name: 'Poulet pondeuse', price: 7000 },
    { name: 'Pintade', price: 10000 },
    { name: 'Lapin', price: 10000 },
  ]},
  { id: 'sauces', label: 'Sauces', items: [
    { name: 'Sauce Gombo', price: 2000 },
    { name: 'Sauce Graine Kpala', price: 2000 },
    { name: 'Sauce Aubergine', price: 1000 },
  ]},
  { id: 'boissons', label: 'Boissons', items: [
    { name: 'Bock', price: 600 },
    { name: 'Beaufort', price: 600 },
    { name: 'Castel', price: 500 },
    { name: 'Sucrerie', price: 600 },
    { name: 'Chill', price: 500 },
    { name: 'Guiness', price: 500 },
    { name: 'Guiness grand', price: 1200 },
    { name: 'Guiness petit kit', price: 1500 },
    { name: 'Ivoire Black', price: 500 },
    { name: 'Ivoire Bleu', price: 500 },
    { name: 'Malta', price: 600 },
    { name: 'Heineken le kit', price: 2000 },
    { name: 'Desperados le kit', price: 2000 },
    { name: 'Eau de source', price: 500 },
  ]},
  { id: 'autre', label: 'Autre', items: [] },
];

const fmt = n => n.toLocaleString('fr-FR').replace(/ | /g, ' ') + ' FCFA';
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};
const STORAGE_KEY = 'montmorency-caisse';

function loadJournal() {
  try {
    const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return all[todayKey()] || [];
  } catch (e) { return []; }
}
function saveJournal(entries) {
  let all = {};
  try { all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  all[todayKey()] = entries;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}

// ---------- Produits ----------
let activeCat = 'braises';
let ticket = []; // { name, price, qty }

function renderTabs() {
  document.getElementById('catTabs').innerHTML = CATEGORIES.map(c =>
    `<button class="cat-tab${c.id === activeCat ? ' active' : ''}" onclick="switchCat('${c.id}')">${c.label}</button>`
  ).join('');
}
function switchCat(id) { activeCat = id; renderTabs(); renderProducts(); }

function renderProducts() {
  const cat = CATEGORIES.find(c => c.id === activeCat);
  const grid = document.getElementById('prodGrid');
  if (cat.id === 'autre') {
    grid.innerHTML = `
      <button class="prod-btn" onclick="addCustom()" style="grid-column:1/-1;align-items:center;text-align:center;">
        <span class="prod-name">+ Montant libre</span>
        <span class="prod-price">Saisir un article et son prix</span>
      </button>`;
    return;
  }
  grid.innerHTML = cat.items.map((it, i) =>
    `<button class="prod-btn" onclick="addItem('${cat.id}',${i})">
      <span class="prod-name">${it.name}</span>
      <span class="prod-price">${fmt(it.price)}</span>
    </button>`
  ).join('');
}

function addItem(catId, idx) {
  const it = CATEGORIES.find(c => c.id === catId).items[idx];
  addToTicket(it.name, it.price);
}
function addCustom() {
  const name = prompt('Nom de l’article :', 'Divers');
  if (name === null) return;
  const priceStr = prompt('Prix en FCFA :', '');
  if (priceStr === null) return;
  const price = parseInt(priceStr.replace(/\D/g, ''), 10);
  if (!price || price <= 0) { alert('Prix invalide.'); return; }
  addToTicket(name.trim() || 'Divers', price);
}
function addToTicket(name, price) {
  const existing = ticket.find(l => l.name === name && l.price === price);
  if (existing) existing.qty += 1;
  else ticket.push({ name, price, qty: 1 });
  renderTicket();
}
function changeQty(i, delta) {
  ticket[i].qty += delta;
  if (ticket[i].qty <= 0) ticket.splice(i, 1);
  renderTicket();
}
function clearTicket() {
  ticket = [];
  document.getElementById('recu').value = '';
  renderTicket();
}
const ticketTotal = () => ticket.reduce((s, l) => s + l.price * l.qty, 0);

function renderTicket() {
  const lines = document.getElementById('ticketLines');
  if (ticket.length === 0) {
    lines.innerHTML = '<p class="ticket-empty">Touchez un article pour l’ajouter au ticket</p>';
  } else {
    lines.innerHTML = ticket.map((l, i) =>
      `<div class="ticket-line">
        <span class="tl-name">${l.name}</span>
        <span class="tl-qty">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span>${l.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </span>
        <span class="tl-total">${fmt(l.price * l.qty)}</span>
      </div>`
    ).join('');
  }
  document.getElementById('ticketTotal').textContent = fmt(ticketTotal());
  document.getElementById('btnEncaisser').disabled = ticket.length === 0;
  renderMonnaie();
}

function renderMonnaie() {
  const el = document.getElementById('monnaie');
  const recu = parseInt(document.getElementById('recu').value, 10);
  const total = ticketTotal();
  if (!recu || total === 0) { el.textContent = '—'; el.classList.remove('negative'); return; }
  const diff = recu - total;
  if (diff < 0) {
    el.textContent = 'Manque ' + fmt(-diff);
    el.classList.add('negative');
  } else {
    el.textContent = fmt(diff);
    el.classList.remove('negative');
  }
}

// ---------- Encaissement & journal ----------
function encaisser() {
  if (ticket.length === 0) return;
  const entries = loadJournal();
  const d = new Date();
  entries.push({
    time: String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'),
    items: ticket.map(l => ({ name: l.name, price: l.price, qty: l.qty })),
    total: ticketTotal(),
  });
  saveJournal(entries);
  clearTicket();
  renderJournal();
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function deleteSale(i) {
  if (!confirm('Supprimer cette vente du journal ?')) return;
  const entries = loadJournal();
  entries.splice(i, 1);
  saveJournal(entries);
  renderJournal();
}

function clearDay() {
  const entries = loadJournal();
  if (entries.length === 0) return;
  if (!confirm('Effacer toutes les ventes de la journée ? Cette action est définitive.')) return;
  saveJournal([]);
  renderJournal();
}

function renderJournal() {
  const entries = loadJournal();
  const table = document.getElementById('journalTable');
  if (entries.length === 0) {
    table.innerHTML = '<p class="journal-empty">Aucune vente enregistrée aujourd’hui</p>';
  } else {
    table.innerHTML = entries.map((e, i) =>
      `<div class="jrow">
        <span class="time">${e.time}</span>
        <span class="items">${e.items.map(it => (it.qty > 1 ? it.qty + '× ' : '') + it.name).join(', ')}</span>
        <span class="amount">${fmt(e.total)}</span>
        <button class="del" onclick="deleteSale(${i})" title="Supprimer">✕</button>
      </div>`
    ).join('');
  }
  const total = entries.reduce((s, e) => s + e.total, 0);
  document.getElementById('statCount').textContent = entries.length;
  document.getElementById('statTotal').textContent = fmt(total);
  document.getElementById('headDayTotal').textContent = fmt(total);
}

function exportCSV() {
  const entries = loadJournal();
  if (entries.length === 0) { alert('Aucune vente à exporter aujourd’hui.'); return; }
  let csv = 'Heure;Articles;Total (FCFA)\n';
  entries.forEach(e => {
    const items = e.items.map(it => (it.qty > 1 ? it.qty + 'x ' : '') + it.name).join(', ');
    csv += `${e.time};"${items.replace(/"/g, '""')}";${e.total}\n`;
  });
  csv += `;TOTAL;${entries.reduce((s, e) => s + e.total, 0)}\n`;
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'caisse-montmorency-' + todayKey() + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Init ----------
document.getElementById('journalDate').textContent =
  new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
renderTabs();
renderProducts();
renderTicket();
renderJournal();
</script>
</body>
</html>
